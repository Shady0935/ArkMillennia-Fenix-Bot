<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10090b">
  <title>Iniciar sesión · Millennia Fenix Bot</title>
  <link rel="icon" href="/assets/emblem.png">
  <link rel="stylesheet" href="/symbols.css?v=millenniafenix-5">
  <link rel="stylesheet" href="/tokens.css?v=millenniafenix-6">
  <link rel="stylesheet" href="/login.css?v=millenniafenix-5">
  <script defer src="/login.js?v=millenniafenix-5"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-visual">
        <a class="login-brand" href="/login" aria-label="Millennia Fenix Bot, ArkMillennia Fenix">
          <img src="/assets/emblem.png" width="48" height="48" alt="">
          <span>MILLENNIA FENIX BOT<small>ARKMILLENNIA FENIX</small></span>
        </a>
        <div class="visual-caption"><span class="eyebrow">PANEL DE CONTROL</span><h1>Millennia Fenix Bot</h1></div>
      </div>
      <div class="login-content">
        <div class="login-mobile-brand"><img src="/assets/emblem.png" width="54" height="54" alt=""><span>MILLENNIA FENIX BOT<small>ARKMILLENNIA FENIX</small></span></div>
        <h2 id="login-title">Acceso a Millennia Fenix Bot</h2>
        <p class="login-description">Panel de control de los módulos y servicios del bot de ArkMillennia Fenix.</p>
        <p id="login-message" class="login-message" role="status" aria-live="polite" hidden></p>
        <a class="button primary" id="login" href="/auth/discord">
          <img class="discord-symbol" src="/assets/discord-symbol.svg" width="25" height="19" alt="">
          <span>Continuar con Discord</span>
          <span class="material-symbols-outlined button-arrow" aria-hidden="true">arrow_forward</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
